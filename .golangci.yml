version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam

formatters:
  enable:
    - gofumpt

linters-settings:
  gofumpt:
    extra-rules: true
  gosec:
    excludes:
      - G104 # unhandled errors (too noisy for TUI apps)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
