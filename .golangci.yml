version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - prealloc
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors (too noisy for TUI apps)

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
