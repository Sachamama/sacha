name: Auto Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create version tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: main
          check-regexp: ^(Test|Lint|Security)$
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Determine semver bump from commits
        id: version
        run: |
          latest=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -z "$latest" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
          else
            # Analyze commits since last tag for conventional commit types
            commits=$(git log "${latest}..HEAD" --pretty=format:"%s")
            bump="patch"
            while IFS= read -r msg; do
              if echo "$msg" | grep -qE '^feat(\(.+\))?!?:'; then
                bump="minor"
                break
              fi
            done <<< "$commits"

            major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            patch=$(echo "$latest" | cut -d. -f3)

            if [ "$bump" = "minor" ]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi
          echo "Next tag: $(grep tag "$GITHUB_OUTPUT")"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}

      - name: Trigger release workflow
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
